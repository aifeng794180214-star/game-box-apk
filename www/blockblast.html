<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#141526">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>方块消除 · Block Blast</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{height:100%;background:#0E0F1B}
  body{
    position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;
    background:
      radial-gradient(120% 80% at 50% -18%, #313A72 0%, rgba(49,58,114,0) 62%),
      radial-gradient(130% 95% at 50% -12%, #262A52 0%, #171930 52%, #0E0F1B 100%);
    color:#EDEFFA;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;align-items:center;justify-content:center;
    -webkit-user-select:none;-moz-user-select:none;user-select:none;
    -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
    touch-action:none;
  }
  canvas{touch-action:none}
  #app{
    position:relative;
    width:100%;height:100%;
    max-width:560px;margin:0 auto;
    /* 顶部 58px：为 juice.js 注入的「返回 / 静音」按钮预留，避免遮挡 HUD */
    padding:calc(env(safe-area-inset-top,0px) + 58px) clamp(8px,3vw,24px) calc(env(safe-area-inset-bottom,0px) + 10px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(8px,1.8vh,15px);
  }

  /* ---------- 顶部 HUD ---------- */
  #hud{
    width:var(--board-w,100%);
    display:flex;align-items:flex-end;justify-content:space-between;
    gap:10px;padding:0 2px;
  }
  .stat{display:flex;flex-direction:column;line-height:1.02}
  .stat.right{align-items:flex-end}
  .stat .lbl{font-size:10px;letter-spacing:.18em;color:#8A90BC;font-weight:700}
  .stat b{
    margin-top:3px;
    font-size:clamp(19px,3.4vh,27px);font-weight:900;font-variant-numeric:tabular-nums;
    letter-spacing:-.02em;color:#fff;
    text-shadow:0 2px 10px rgba(140,160,255,.35);
    transition:transform .15s cubic-bezier(.2,1.5,.4,1);
    display:block;
  }
  .stat b.bump{transform:scale(1.15)}
  .stat.right b{color:#A7B2E8;text-shadow:none}
  .hud-right{display:flex;align-items:center;gap:9px}
  .icon-btn{
    width:34px;height:34px;border-radius:11px;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.055);
    color:#C6CBF2;display:grid;place-items:center;
    cursor:pointer;transition:transform .16s,background .16s;
    flex:0 0 auto;margin-bottom:1px;
  }
  .icon-btn:hover{background:rgba(255,255,255,.12)}
  .icon-btn:active{transform:scale(.9)}
  .icon-btn svg{width:17px;height:17px;display:block}

  /* ---------- 棋盘 ---------- */
  #board{
    display:grid;
    grid-template-columns:repeat(12,var(--cell));
    grid-auto-rows:var(--cell);
    gap:var(--gap);
    padding:var(--pad);
    border-radius:calc(var(--cell)*.38);
    background:radial-gradient(115% 85% at 50% 0%, #232747 0%, #191C36 55%, #13152A 100%);
    box-shadow:
      0 0 0 1px rgba(255,255,255,.055),
      inset 0 2px 0 rgba(255,255,255,.06),
      inset 0 6px 26px rgba(0,0,0,.55),
      inset 0 -14px 34px rgba(0,0,0,.35),
      0 30px 60px -26px rgba(0,0,0,.95),
      0 0 100px -46px rgba(120,146,255,.75);
    position:relative;
    touch-action:none;
    transition:box-shadow .25s;
  }
  #board.aiming{animation:aimPulse 1.1s ease-in-out infinite}
  @keyframes aimPulse{
    0%,100%{box-shadow:0 0 0 2px rgba(255,110,142,.55),0 0 22px rgba(255,86,124,.3),inset 0 6px 26px rgba(0,0,0,.55),0 30px 60px -26px rgba(0,0,0,.95)}
    50%{box-shadow:0 0 0 2px rgba(255,126,156,.95),0 0 44px rgba(255,86,124,.62),inset 0 6px 26px rgba(0,0,0,.55),0 30px 60px -26px rgba(0,0,0,.95)}
  }

  .cell{
    width:var(--cell);height:var(--cell);
    border-radius:calc(var(--cell)*.22);
    background:linear-gradient(180deg,#232647 0%,#1C1F3B 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.04),
      inset 0 -1px 1px rgba(0,0,0,.4);
    position:relative;
  }
  /* 糖果立体块：渐变填充 + 顶部高光 + 内阴影 + 外发光 */
  .cell.filled{
    background:linear-gradient(157deg,var(--c1) 0%,var(--c1) 22%,var(--c2) 100%);
    box-shadow:
      inset 0 calc(var(--cell)*.1) calc(var(--cell)*.06) rgba(255,255,255,.55),
      inset 0 calc(var(--cell)*-.11) calc(var(--cell)*.16) rgba(0,0,0,.3),
      inset 0 0 0 1px rgba(255,255,255,.14),
      0 calc(var(--cell)*.055) calc(var(--cell)*.12) rgba(0,0,0,.4),
      0 0 calc(var(--cell)*.32) rgba(var(--rgb),.4);
    overflow:hidden;
  }
  .cell.filled::before{
    content:"";position:absolute;left:9%;right:9%;top:5%;height:26%;
    border-radius:50%;
    background:linear-gradient(180deg,rgba(255,255,255,.78),rgba(255,255,255,0));
    filter:blur(calc(var(--cell)*.028));
    pointer-events:none;
  }
  .cell.filled::after{
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:radial-gradient(115% 85% at 76% 102%,rgba(0,0,0,.26),rgba(0,0,0,0) 58%);
  }
  .cell.ghost{
    background:rgba(var(--rgb),.2);
    box-shadow:
      inset 0 0 0 max(2px,calc(var(--cell)*.075)) rgba(var(--rgb),.92),
      0 0 calc(var(--cell)*.42) rgba(var(--rgb),.5);
    animation:ghostGlow 1.05s ease-in-out infinite;
  }
  @keyframes ghostGlow{0%,100%{opacity:.72}50%{opacity:1}}
  .cell.clearing{
    animation:popOut .34s cubic-bezier(.4,0,.6,1) forwards;
    z-index:3;
  }
  .cell.drop{animation:dropIn .28s cubic-bezier(.34,1.5,.64,1)}
  .cell.empty-slot{background:transparent;box-shadow:none}
  .cell.empty-slot::before,.cell.empty-slot::after{display:none}
  @keyframes popOut{
    0%{transform:scale(1);filter:brightness(1)}
    32%{transform:scale(1.18);filter:brightness(2.5)}
    100%{transform:scale(.12);filter:brightness(2.9);opacity:0}
  }
  @keyframes dropIn{
    0%{transform:scale(.82);opacity:.35}
    62%{transform:scale(1.07)}
    100%{transform:scale(1);opacity:1}
  }

  /* ---------- 备选槽 ---------- */
  #tray{display:flex;gap:calc(var(--cell)*.16);width:var(--board-w,100%)}
  .slot{
    flex:1 1 0;min-width:0;
    height:calc(var(--cell)*2.6);
    display:grid;place-items:center;
    border-radius:calc(var(--cell)*.3);
    background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.012));
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.08),
      inset 0 -12px 22px rgba(0,0,0,.32),
      0 8px 18px -14px rgba(0,0,0,.9);
    position:relative;
    touch-action:none;
  }
  .slot::after{
    content:"";position:absolute;inset:9%;border-radius:inherit;
    border:1px dashed rgba(255,255,255,.06);pointer-events:none;
  }
  .slot:empty::after{border-color:rgba(255,255,255,.12)}
  .slot .piece{
    transition:opacity .18s, transform .18s, filter .18s;
    animation:slotIn .32s cubic-bezier(.34,1.5,.64,1);
  }
  .slot.picked .piece{opacity:.14;transform:scale(.84);filter:blur(.8px)}
  @keyframes slotIn{
    0%{transform:scale(.45);opacity:0}
    100%{transform:scale(1);opacity:1}
  }

  /* ---------- 方块容器 ---------- */
  .piece{display:grid;will-change:transform}

  /* ---------- 拖拽层 ---------- */
  #dragLayer{position:fixed;inset:0;pointer-events:none;z-index:60}
  #dragLayer .piece{
    position:absolute;left:0;top:0;transform-origin:0 0;
    pointer-events:none;
    filter:drop-shadow(0 16px 20px rgba(0,0,0,.5)) drop-shadow(0 2px 6px rgba(0,0,0,.45));
    z-index:61;
  }

  /* ---------- 道具栏 ---------- */
  #props{
    width:var(--board-w,100%);
    display:flex;align-items:center;justify-content:center;gap:10px;
    position:relative;padding:1px 0 2px;
  }
  .prop{
    position:relative;flex:1 1 0;max-width:168px;min-height:48px;
    display:flex;align-items:center;justify-content:center;gap:7px;
    padding:0 12px;
    border:1px solid rgba(255,255,255,.17);border-radius:16px;
    background:linear-gradient(160deg,rgba(255,255,255,.15),rgba(255,255,255,.045));
    -webkit-backdrop-filter:blur(16px) saturate(150%);
    backdrop-filter:blur(16px) saturate(150%);
    box-shadow:
      0 10px 26px -14px rgba(0,0,0,.9),
      inset 0 1px 0 rgba(255,255,255,.3),
      inset 0 -10px 20px -12px rgba(0,0,0,.6);
    color:#EAF0FF;
    font:800 13px/1 inherit;letter-spacing:.05em;
    cursor:pointer;touch-action:manipulation;
    transition:transform .16s cubic-bezier(.2,1.4,.4,1),box-shadow .2s,opacity .2s,filter .25s;
  }
  .prop:active{transform:scale(.95)}
  .prop svg{width:18px;height:18px;display:block;flex:0 0 auto;filter:drop-shadow(0 2px 4px rgba(0,0,0,.45))}
  .prop .cnt{
    position:absolute;top:-6px;right:-5px;min-width:20px;height:20px;padding:0 5px;
    border-radius:999px;display:grid;place-items:center;
    font:900 11px/1 inherit;letter-spacing:0;color:#22160A;
    background:linear-gradient(180deg,#FFE892,#FFB13C);
    box-shadow:0 4px 10px -2px rgba(255,170,60,.75),inset 0 1px 0 rgba(255,255,255,.85);
    transition:opacity .2s;
  }
  #shuffleBtn{color:#B8DBFF}
  #bombBtn{color:#FFC1CE}
  .prop.on{
    border-color:rgba(255,120,150,.85);
    box-shadow:0 0 0 1px rgba(255,120,150,.5),0 0 24px rgba(255,86,124,.5),inset 0 1px 0 rgba(255,255,255,.3);
    background:linear-gradient(160deg,rgba(255,140,165,.3),rgba(255,86,124,.12));
  }
  .prop.off{opacity:.36;filter:saturate(.25);pointer-events:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
  .prop.off .cnt{opacity:.5}
  .prop.cool{pointer-events:none;filter:brightness(.86)}
  #hint{
    position:absolute;left:50%;bottom:calc(100% + 9px);transform:translate(-50%,7px);
    padding:7px 15px;border-radius:999px;white-space:nowrap;
    font:800 12px/1 inherit;letter-spacing:.04em;color:#fff;
    background:linear-gradient(135deg,rgba(255,132,158,.97),rgba(255,72,110,.97));
    box-shadow:0 10px 24px -10px rgba(255,72,110,.95),inset 0 1px 0 rgba(255,255,255,.55);
    opacity:0;pointer-events:none;
    transition:opacity .2s,transform .24s cubic-bezier(.2,1.4,.4,1);
  }
  #hint.show{opacity:1;transform:translate(-50%,0)}

  /* ---------- 特效层 ---------- */
  #fxLayer{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
  .float{
    position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);
    text-align:center;white-space:nowrap;
  }
  .float .fx-main{
    font-size:clamp(19px,4vh,30px);font-weight:900;letter-spacing:.02em;
    background:linear-gradient(180deg,#fff 20%,#FFE07A 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 14px rgba(0,0,0,.7));
  }

  /* ---------- 结算弹窗 ---------- */
  #overlay{
    position:fixed;inset:0;z-index:100;display:grid;place-items:center;
    background:rgba(9,10,20,.6);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    opacity:0;pointer-events:none;transition:opacity .3s;
    padding:20px;
  }
  #overlay.show{opacity:1;pointer-events:auto}
  .card{
    width:min(86vw,330px);
    padding:26px 22px 22px;
    border-radius:26px;text-align:center;
    background:linear-gradient(180deg,#2E3462 0%,#1D2039 100%);
    box-shadow:
      0 0 0 1px rgba(255,255,255,.1),
      0 30px 70px -20px rgba(0,0,0,.9),
      inset 0 1px 0 rgba(255,255,255,.14);
    transform:translateY(16px) scale(.95);opacity:0;
    transition:transform .34s cubic-bezier(.34,1.4,.64,1),opacity .34s;
  }
  #overlay.show .card{transform:none;opacity:1}
  .card h2{
    font-size:22px;font-weight:900;letter-spacing:.05em;
    background:linear-gradient(180deg,#fff,#B9C3FF);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .card .badge{
    display:none;margin:9px auto 0;width:fit-content;
    padding:4px 12px;border-radius:20px;font-size:12px;font-weight:900;
    color:#3A2A00;background:linear-gradient(90deg,#FFE066,#FFB347);
    box-shadow:0 4px 14px rgba(255,180,60,.4);
  }
  .score-row{display:flex;justify-content:center;gap:13px;margin:20px 0 22px}
  .score-box{
    flex:1;padding:12px 6px;border-radius:16px;
    background:rgba(0,0,0,.28);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
  }
  .score-box span{display:block;font-size:11px;letter-spacing:.14em;color:#8A90BC;font-weight:700}
  .score-box b{display:block;margin-top:4px;font-size:24px;font-weight:900;color:#fff;font-variant-numeric:tabular-nums}
  .score-box.gold b{color:#FFD75E}
  #againBtn{
    width:100%;padding:14px;border:0;border-radius:16px;cursor:pointer;
    font-size:16px;font-weight:900;letter-spacing:.06em;color:#20140A;
    background:linear-gradient(180deg,#FFE07A,#FFB43D);
    box-shadow:0 8px 22px -6px rgba(255,175,60,.65),inset 0 1px 0 rgba(255,255,255,.6);
    transition:transform .15s,filter .15s;
    font-family:inherit;
  }
  #againBtn:hover{filter:brightness(1.06)}
  #againBtn:active{transform:scale(.97)}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="stat">
      <span class="lbl">得分</span>
      <b id="scoreEl">0</b>
    </div>
    <div class="hud-right">
      <div class="stat right">
        <span class="lbl">最高</span>
        <b id="bestEl">0</b>
      </div>
      <button id="restartBtn" class="icon-btn" title="重新开始" aria-label="重新开始">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 3-6.7"/>
          <path d="M3 4.5V10h5.5"/>
        </svg>
      </button>
    </div>
  </header>

  <div id="board"></div>

  <div id="tray">
    <div class="slot" data-i="0"></div>
    <div class="slot" data-i="1"></div>
    <div class="slot" data-i="2"></div>
  </div>

  <div id="props">
    <div id="hint">点击棋盘投放炸弹</div>
    <button class="prop" id="shuffleBtn" aria-label="洗牌">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 3h5v5"/><path d="M21 3l-6.5 6.5"/>
        <path d="M21 16v5h-5"/><path d="M21 21l-6.5-6.5"/>
        <path d="M3 7h3.5L15 15.5"/><path d="M3 17h3.5L8 15.5"/>
      </svg>
      <span>洗牌</span>
      <span class="cnt" id="shuffleCnt">2</span>
    </button>
    <button class="prop" id="bombBtn" aria-label="炸弹">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="10.5" cy="14.5" r="6.5"/>
        <path d="M15.5 9.5l1.8-1.8"/><path d="M18 4v3.2M21.2 5.6l-2.6 1.6"/>
        <path d="M8 12.6a3 3 0 0 1 2.4-1.4"/>
      </svg>
      <span>炸弹</span>
      <span class="cnt" id="bombCnt">2</span>
    </button>
  </div>
</div>

<div id="dragLayer"></div>
<div id="fxLayer"></div>

<div id="overlay">
  <div class="card">
    <h2>游戏结束</h2>
    <div class="badge" id="newRecBadge">🎉 新纪录！</div>
    <div class="score-row">
      <div class="score-box">
        <span>本局得分</span>
        <b id="finalScore">0</b>
      </div>
      <div class="score-box gold">
        <span>历史最高</span>
        <b id="bestScore">0</b>
      </div>
    </div>
    <button id="againBtn">再来一局</button>
  </div>
</div>

<script src="juice.js"></script>
<script>
(function(){
  'use strict';

  /* ========================================================
     一、常量与全局状态
     ======================================================== */
  const N = 12;                       // 棋盘 12×12
  const GAME = 'blockblast';

  // 棋盘：null = 空；否则存 {c1,c2,rgb}
  const board = Array.from({length:N}, () => new Array(N).fill(null));

  let tray = [null, null, null];      // 三个备选槽
  let score = 0;
  let best  = 0;
  let busy  = false;                  // 动画期锁输入
  let over  = false;

  let cell = 32, gap = 3, pad = 6;    // 由 layout() 计算
  let dragging = null;
  let ghostTarget = null;

  // 救场道具（每局各 2 次）
  let props = {shuffle: 2, bomb: 2};
  let bombMode = false;
  let propLock = false;

  /* ========================================================
     二、DOM 引用
     ======================================================== */
  const $ = s => document.querySelector(s);
  const appEl     = $('#app');
  const boardEl   = $('#board');
  const trayEl    = $('#tray');
  const dragLayer = $('#dragLayer');
  const fxLayer   = $('#fxLayer');
  const hudEl     = $('#hud');
  const propsEl   = $('#props');
  const scoreEl   = $('#scoreEl');
  const bestEl    = $('#bestEl');
  const overlay   = $('#overlay');
  const finalScoreEl = $('#finalScore');
  const bestScoreEl  = $('#bestScore');
  const newRecBadge  = $('#newRecBadge');
  const restartBtn= $('#restartBtn');
  const againBtn  = $('#againBtn');
  const shuffleBtn= $('#shuffleBtn');
  const bombBtn   = $('#bombBtn');
  const shuffleCnt= $('#shuffleCnt');
  const bombCnt   = $('#bombCnt');
  const hintEl    = $('#hint');
  const slotEls   = Array.prototype.slice.call(document.querySelectorAll('.slot'));
  const cellEls   = [];

  const sleep = ms => new Promise(r => setTimeout(r, ms));

  /* ========================================================
     三、形状库 / 色板
     ======================================================== */
  const S = (w, h, cells, weight) => ({w, h, cells, weight});
  const SHAPES = [
    S(1,1,[[0,0]], 5),
    S(2,1,[[0,0],[0,1]], 8),
    S(1,2,[[0,0],[1,0]], 8),
    S(3,1,[[0,0],[0,1],[0,2]], 7),
    S(1,3,[[0,0],[1,0],[2,0]], 7),
    S(4,1,[[0,0],[0,1],[0,2],[0,3]], 4),
    S(1,4,[[0,0],[1,0],[2,0],[3,0]], 4),
    S(5,1,[[0,0],[0,1],[0,2],[0,3],[0,4]], 1.5),
    S(1,5,[[0,0],[1,0],[2,0],[3,0],[4,0]], 1.5),
    S(2,2,[[0,0],[0,1],[1,0],[1,1]], 6),
    S(3,3,[[0,0],[0,1],[0,2],[1,0],[1,1],[1,2],[2,0],[2,1],[2,2]], 1),
    S(2,2,[[0,0],[1,0],[1,1]], 4),
    S(2,2,[[0,1],[1,0],[1,1]], 4),
    S(2,2,[[0,0],[0,1],[1,0]], 4),
    S(2,2,[[0,0],[0,1],[1,1]], 4),
    S(3,3,[[0,0],[1,0],[2,0],[2,1],[2,2]], 2),
    S(3,3,[[0,0],[0,1],[0,2],[1,0],[2,0]], 2),
    S(3,3,[[0,0],[0,1],[0,2],[1,2],[2,2]], 2),
    S(3,3,[[0,2],[1,2],[2,0],[2,1],[2,2]], 2),
    S(3,2,[[0,0],[0,1],[0,2],[1,1]], 3),
    S(2,3,[[0,0],[1,0],[1,1],[2,0]], 3),
    S(3,2,[[0,1],[1,0],[1,1],[1,2]], 3),
    S(2,3,[[0,1],[1,0],[1,1],[2,1]], 3),
    S(3,2,[[0,0],[0,1],[1,1],[1,2]], 2),
    S(3,2,[[0,1],[0,2],[1,0],[1,1]], 2),
    S(2,3,[[0,0],[1,0],[1,1],[2,1]], 2),
    S(2,3,[[0,1],[1,0],[1,1],[2,0]], 2),
    S(3,2,[[0,0],[0,1],[0,2],[1,0],[1,1],[1,2]], 1.4),
    S(2,3,[[0,0],[0,1],[1,0],[1,1],[2,0],[2,1]], 1.4),
    S(4,2,[[0,0],[0,1],[0,2],[0,3],[1,0],[1,1],[1,2],[1,3]], 0.8)
  ];

  const PALETTE = [
    {c1:'#FFA3B6', c2:'#DE2F63', rgb:'255,122,156'},
    {c1:'#FFD08A', c2:'#ED7611', rgb:'255,179,92'},
    {c1:'#FFEE9B', c2:'#E7A500', rgb:'255,224,102'},
    {c1:'#A5F3AC', c2:'#18A046', rgb:'125,230,143'},
    {c1:'#8FF1E6', c2:'#0E8C88', rgb:'94,224,212'},
    {c1:'#9CC4FF', c2:'#2454CC', rgb:'111,168,255'},
    {c1:'#D0B8FF', c2:'#6528D4', rgb:'176,132,255'},
    {c1:'#FFB6F2', c2:'#C4239F', rgb:'255,138,229'}
  ];

  /* ========================================================
     四、音效：全部走 juice.js 内核，入口统一拦截静音
     ======================================================== */
  function snd(name, arg){
    if(window.Juice && Juice.muted) return;
    if(!window.Juice || !Juice.sfx || !Juice.sfx[name]) return;
    try{ Juice.sfx[name](arg); }catch(e){}
  }

  /* ========================================================
     五、布局
     ======================================================== */
  function boardWidth(){ return N * cell + (N - 1) * gap + 2 * pad; }

  function layout(){
    const cs   = getComputedStyle(appEl);
    const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
    const padY = parseFloat(cs.paddingTop)  + parseFloat(cs.paddingBottom);
    const gapY = parseFloat(cs.rowGap) || 0;

    const availW = appEl.clientWidth  - padX;
    const availH = appEl.clientHeight - padY;

    // 纵向预留：HUD + 道具栏 + 三处间距
    const reserve = hudEl.offsetHeight + propsEl.offsetHeight + gapY * 3 + 6;
    const maxBoardW = Math.min(availW, 520);

    // 横向 13.28 = 12 格 + 11 间隙 + 左右内边距；纵向 15.88 = 棋盘 + 备选槽(2.6 格)
    const cW = maxBoardW / 13.28;
    const cH = (availH - reserve) / 15.88;

    let c = Math.min(cW, cH, 46);
    c = Math.max(14, Math.floor(c));
    if(!isFinite(c)) c = 26;

    cell = c;
    gap  = Math.max(2, Math.round(c * 0.085));
    pad  = Math.max(4, Math.round(c * 0.17));

    const root = document.documentElement.style;
    root.setProperty('--cell', cell + 'px');
    root.setProperty('--gap',  gap + 'px');
    root.setProperty('--pad',  pad + 'px');
    root.setProperty('--board-w', boardWidth() + 'px');

    renderTray();
  }

  /* ========================================================
     六、渲染
     ======================================================== */
  function buildBoard(){
    boardEl.textContent = '';
    cellEls.length = 0;
    for(let r = 0; r < N; r++){
      for(let c = 0; c < N; c++){
        const d = document.createElement('div');
        d.className = 'cell';
        d.dataset.r = r; d.dataset.c = c;
        boardEl.appendChild(d);
        cellEls.push(d);
      }
    }
  }

  function renderBoard(){
    for(let r = 0; r < N; r++){
      for(let c = 0; c < N; c++){
        const el = cellEls[r * N + c];
        const v  = board[r][c];
        el.className = v ? 'cell filled' : 'cell';
        if(v){
          el.style.setProperty('--c1', v.c1);
          el.style.setProperty('--c2', v.c2);
          el.style.setProperty('--rgb', v.rgb);
        } else {
          el.style.removeProperty('--c1');
          el.style.removeProperty('--c2');
          el.style.removeProperty('--rgb');
        }
      }
    }
  }

  function buildPiece(def, color, size, gGap){
    const el = document.createElement('div');
    el.className = 'piece';
    el.style.setProperty('--cell', size + 'px');
    el.style.setProperty('--c1',  color.c1);
    el.style.setProperty('--c2',  color.c2);
    el.style.setProperty('--rgb', color.rgb);
    el.style.gridTemplateColumns = new Array(def.w).fill(size + 'px').join(' ');
    el.style.gridAutoRows = size + 'px';
    el.style.gap = gGap + 'px';

    const set = new Set(def.cells.map(p => p[0] + ',' + p[1]));
    for(let r = 0; r < def.h; r++){
      for(let c = 0; c < def.w; c++){
        const d = document.createElement('div');
        d.className = set.has(r + ',' + c) ? 'cell filled' : 'cell empty-slot';
        el.appendChild(d);
      }
    }
    return el;
  }

  function miniCellFor(def){
    const slotW = (boardWidth() - 2 * (cell * 0.16)) / 3;
    const slotH = cell * 2.6;
    const mGap  = Math.max(1, Math.round(cell * 0.05));
    const s = Math.min(
      (slotW - 12 - (def.w - 1) * mGap) / def.w,
      (slotH - 12 - (def.h - 1) * mGap) / def.h,
      cell * 0.82
    );
    return Math.max(8, Math.floor(s));
  }

  function renderTray(){
    for(let i = 0; i < 3; i++){
      const slot = slotEls[i];
      slot.textContent = '';
      slot.classList.remove('picked');
      const p = tray[i];
      if(!p) continue;
      const mGap = Math.max(1, Math.round(cell * 0.05));
      slot.appendChild(buildPiece(p.def, p.color, miniCellFor(p.def), mGap));
    }
  }

  function updateScore(bump){
    scoreEl.textContent = score;
    if(score > best){
      best = score;
      bestEl.textContent = best;
    }
    if(bump){
      scoreEl.classList.remove('bump');
      void scoreEl.offsetWidth;
      scoreEl.classList.add('bump');
      setTimeout(() => scoreEl.classList.remove('bump'), 160);
    }
  }

  function readBest(){
    const v = (window.Juice && Juice.getStat) ? Juice.getStat(GAME).best : 0;
    best = Math.max(best, v || 0);
    bestEl.textContent = best;
  }

  /* ========================================================
     七、方块生成
     ======================================================== */
  function pickShape(){
    const total = SHAPES.reduce((s, x) => s + x.weight, 0);
    let t = Math.random() * total;
    for(const s of SHAPES){
      t -= s.weight;
      if(t <= 0) return s;
    }
    return SHAPES[0];
  }

  function makePiece(usedColors){
    const def = pickShape();
    let pool = PALETTE;
    if(usedColors && usedColors.length < PALETTE.length){
      pool = PALETTE.filter(c => usedColors.indexOf(c) < 0);
    }
    return {def, color: pool[Math.floor(Math.random() * pool.length)]};
  }

  function refreshTray(){
    const used = [];
    for(let i = 0; i < 3; i++){
      const p = makePiece(used);
      used.push(p.color);
      tray[i] = p;
    }
    renderTray();
  }

  /* ========================================================
     八、碰撞 / 死局
     ======================================================== */
  function canPlace(cells, r, c){
    for(let i = 0; i < cells.length; i++){
      const rr = r + cells[i][0];
      const cc = c + cells[i][1];
      if(rr < 0 || rr >= N || cc < 0 || cc >= N) return false;
      if(board[rr][cc]) return false;
    }
    return true;
  }

  function findFullLines(){
    const rows = [], cols = [];
    for(let r = 0; r < N; r++){
      let full = true;
      for(let c = 0; c < N; c++){ if(!board[r][c]){ full = false; break; } }
      if(full) rows.push(r);
    }
    for(let c = 0; c < N; c++){
      let full = true;
      for(let r = 0; r < N; r++){ if(!board[r][c]){ full = false; break; } }
      if(full) cols.push(c);
    }
    return {rows, cols};
  }

  function isAnyPlaceable(){
    for(let i = 0; i < 3; i++){
      const p = tray[i];
      if(!p) continue;
      for(let r = 0; r < N; r++){
        for(let c = 0; c < N; c++){
          if(canPlace(p.def.cells, r, c)) return true;
        }
      }
    }
    return false;
  }

  /* ========================================================
     九、拖拽（Pointer Events）
     ======================================================== */
  function boardOrigin(){
    const rect = boardEl.getBoundingClientRect();
    return {x: rect.left + pad, y: rect.top + pad};
  }

  function cellCenter(k){
    const o = boardOrigin(), pitch = cell + gap;
    return {
      x: o.x + (k % N + 0.5) * pitch,
      y: o.y + (((k / N) | 0) + 0.5) * pitch
    };
  }

  function clearGhost(){
    cellEls.forEach(el => {
      if(el.classList.contains('ghost')){
        el.classList.remove('ghost');
        el.style.removeProperty('--rgb');
      }
    });
    ghostTarget = null;
  }

  function paintGhost(){
    clearGhost();
    if(!dragging || busy || over) return;
    const def = dragging.piece.def;
    const o = boardOrigin();
    const pitch = cell + gap;
    const col = Math.round((dragging.left - o.x) / pitch);
    const row = Math.round((dragging.top  - o.y) / pitch);
    if(!canPlace(def.cells, row, col)) return;

    ghostTarget = {row, col};
    for(let i = 0; i < def.cells.length; i++){
      const rr = row + def.cells[i][0];
      const cc = col + def.cells[i][1];
      const el = cellEls[rr * N + cc];
      el.classList.add('ghost');
      el.style.setProperty('--rgb', dragging.piece.color.rgb);
    }
  }

  function startDrag(e, idx){
    if(over || busy || dragging || bombMode) return;
    const piece = tray[idx];
    if(!piece) return;
    e.preventDefault();

    const previewEl = slotEls[idx].querySelector('.piece');
    if(!previewEl) return;
    const rect = previewEl.getBoundingClientRect();
    const bw = piece.def.w * cell + (piece.def.w - 1) * gap;
    const bh = piece.def.h * cell + (piece.def.h - 1) * gap;

    const rx = rect.width  ? Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width))  : 0.5;
    const ry = rect.height ? Math.min(1, Math.max(0, (e.clientY - rect.top)  / rect.height)) : 0.5;

    const lift = (e.pointerType === 'mouse') ? 0 : Math.round(cell * 2.2);

    const el = buildPiece(piece.def, piece.color, cell, gap);
    dragLayer.appendChild(el);

    dragging = {
      idx, piece, el, bw, bh, rx, ry, lift,
      left: e.clientX - rx * bw,
      top:  e.clientY - ry * bh - lift
    };

    positionDrag();
    slotEls[idx].classList.add('picked');
    snd('click');

    window.addEventListener('pointermove', onMove, {passive:false});
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
  }

  function positionDrag(){
    const d = dragging; if(!d) return;
    d.el.style.transform = 'translate3d(' + d.left + 'px,' + d.top + 'px,0) scale(1.04)';
  }

  function onMove(e){
    const d = dragging; if(!d) return;
    e.preventDefault();
    d.left = e.clientX - d.rx * d.bw;
    d.top  = e.clientY - d.ry * d.bh - d.lift;
    positionDrag();
    paintGhost();
  }

  function onUp(){
    const d = dragging;
    if(!d) return;
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onUp);

    const target = ghostTarget;
    clearGhost();
    dragging = null;

    if(target && canPlace(d.piece.def.cells, target.row, target.col)){
      d.el.remove();
      slotEls[d.idx].classList.remove('picked');
      dropPiece(d.idx, d.piece, target.row, target.col);
    } else {
      flyBack(d);
    }
  }

  function flyBack(d){
    const previewEl = slotEls[d.idx].querySelector('.piece');
    const el = d.el;
    el.style.transition = 'transform .26s cubic-bezier(.3,.9,.4,1.15)';
    if(previewEl){
      const r = previewEl.getBoundingClientRect();
      const s = Math.min(r.width / d.bw, r.height / d.bh);
      el.style.transform = 'translate3d(' + r.left + 'px,' + r.top + 'px,0) scale(' + s + ')';
      el.style.filter = 'none';
    } else {
      el.style.opacity = '0';
      el.style.transform += ' scale(.6)';
    }
    setTimeout(() => {
      el.remove();
      slotEls[d.idx].classList.remove('picked');
    }, 270);
  }

  /* ========================================================
     十、落子 / 消除 / 计分
     ======================================================== */
  async function dropPiece(idx, piece, row, col){
    busy = true;
    const cells = piece.def.cells;
    const dropped = [];
    for(let i = 0; i < cells.length; i++){
      const rr = row + cells[i][0];
      const cc = col + cells[i][1];
      board[rr][cc] = piece.color;
      dropped.push(rr * N + cc);
    }
    tray[idx] = null;
    slotEls[idx].textContent = '';
    slotEls[idx].classList.remove('picked');

    score += cells.length;
    updateScore(true);
    renderBoard();
    dropped.forEach(k => cellEls[k].classList.add('drop'));
    snd('place');
    if(window.Juice) Juice.vibrate(8);

    await sleep(105);

    const {rows, cols} = findFullLines();
    if(rows.length || cols.length){
      await resolveClear(rows, cols);
    }

    if(tray[0] === null && tray[1] === null && tray[2] === null){
      refreshTray();
      await sleep(110);
    }

    if(!isAnyPlaceable()){
      await sleep(170);
      endGame();
      return;
    }
    busy = false;
  }

  // 行/列消除：连击倍率 + 粒子 + 屏震 + 飘字
  async function resolveClear(rows, cols){
    const set = new Set();
    rows.forEach(r => { for(let c = 0; c < N; c++) set.add(r * N + c); });
    cols.forEach(c => { for(let r = 0; r < N; r++) set.add(r * N + c); });
    const list = Array.from(set);

    const lineCount = rows.length + cols.length;

    // 连击倍率：juice.js 内部 2.4s 无消除自动归零，倍率回到 1
    const mul = window.Juice ? Juice.combo() : 1;
    const comboCnt = window.Juice ? Juice.comboCount : 1;

    const base = list.length * 10 + (lineCount - 1) * 50;
    const gain = Math.round(base * mul);
    score += gain;
    updateScore(true);

    // 消除区域中心的视口坐标（飘字锚点）
    const o = boardOrigin(), pitch = cell + gap;
    let sumR = 0, sumC = 0;
    list.forEach(k => { sumR += (k / N) | 0; sumC += k % N; });
    const cx = o.x + (sumC / list.length + 0.5) * pitch;
    const cy = o.y + (sumR / list.length + 0.5) * pitch;

    if(window.Juice){
      Juice.float('+' + gain, cx, cy, {
        color: '#FFE38A',
        size: 24 + Math.min(12, lineCount * 3 + comboCnt * 2),
        glow: 'rgba(255,215,110,.65)',
        dy: -78
      });
    }

    // 粒子爆裂：颜色取方块渐变色；多行消除加大密度
    const per = lineCount >= 3 ? 9 : (lineCount === 2 ? 7 : 5);
    const sample = Math.min(list.length, 26);
    const stepI = list.length / sample;
    for(let i = 0; i < sample; i++){
      const k = list[Math.floor(i * stepI)];
      const v = board[(k / N) | 0][k % N];
      const p = cellCenter(k);
      if(window.Juice){
        Juice.burst(p.x, p.y, {
          count: per,
          colors: v ? [v.c1, v.c2, '#ffffff'] : ['#ffffff'],
          speed: 210 + lineCount * 40,
          size: cell * 0.13,
          life: 560 + lineCount * 60,
          gravity: 900,
          lift: 60,
          shape: 'square'
        });
      }
    }
    if(lineCount >= 2 && window.Juice){
      Juice.burst(cx, cy, {
        count: 16, colors: ['#FFE38A','#FF9FB8','#9CD0FF','#ffffff'],
        speed: 340, size: cell * 0.16, life: 820, gravity: 700, lift: 90
      });
    }

    if(window.Juice){
      Juice.shake(boardEl, lineCount >= 2 ? 9 : 5, lineCount >= 2 ? 340 : 230);
      Juice.vibrate(lineCount >= 2 ? [18, 26, 20] : 12);
    }
    snd('clear', Math.min(9, 2 + lineCount + (comboCnt - 1)));

    if(lineCount >= 2 || comboCnt >= 2){
      const title = comboCnt >= 5 ? '无敌了!'
                  : comboCnt >= 4 ? '太神了!'
                  : comboCnt >= 3 ? '棒极了!'
                  : lineCount >= 3 ? '三四连消!' : '多行消除!';
      praise(title);
    }

    list.forEach(k => cellEls[k].classList.add('clearing'));
    await sleep(330);
    list.forEach(k => { board[(k / N) | 0][k % N] = null; });
    renderBoard();
    await sleep(50);
  }

  // 大号赞语（只显示文案，分数由 Juice.float 负责）
  function praise(text){
    const el = document.createElement('div');
    el.className = 'float';
    const inner = document.createElement('div');
    inner.className = 'fx-main';
    inner.textContent = text;   // 文案为内部常量，textContent 无 XSS 风险
    el.appendChild(inner);
    fxLayer.appendChild(el);
    el.animate([
      {transform:'translate(-50%,-50%) scale(.55)', opacity:0, offset:0},
      {transform:'translate(-50%,-60%) scale(1.1)', opacity:1, offset:.24},
      {transform:'translate(-50%,-78%) scale(1)',   opacity:1, offset:.68},
      {transform:'translate(-50%,-104%) scale(.9)', opacity:0, offset:1}
    ], {duration:1000, easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish = () => el.remove();
  }

  /* ========================================================
     十一、救场道具：洗牌 / 炸弹
     ======================================================== */
  function updateProps(){
    shuffleCnt.textContent = props.shuffle;
    bombCnt.textContent = props.bomb;
    shuffleBtn.classList.toggle('off', props.shuffle <= 0 || over);
    bombBtn.classList.toggle('off', props.bomb <= 0 || over);
    bombBtn.classList.toggle('on', bombMode);
    hintEl.classList.toggle('show', bombMode);
    boardEl.classList.toggle('aiming', bombMode);
  }

  function lockProp(btn){
    btn.classList.add('cool');
    setTimeout(() => btn.classList.remove('cool'), 420);
  }

  function doShuffle(){
    if(over || busy || propLock || props.shuffle <= 0) return;
    propLock = true;
    props.shuffle--;

    const used = [];
    for(let i = 0; i < 3; i++){
      if(!tray[i]) continue;
      const p = makePiece(used);
      used.push(p.color);
      tray[i] = p;
    }
    if(tray[0] === null && tray[1] === null && tray[2] === null) refreshTray();
    else renderTray();

    updateProps();
    lockProp(shuffleBtn);
    snd('prop');
    if(window.Juice){
      const r = trayEl.getBoundingClientRect();
      Juice.float('洗牌!', r.left + r.width / 2, r.top + r.height / 2, {
        color:'#BFE0FF', size:20, glow:'rgba(140,200,255,.6)', dy:-52, life:700
      });
      Juice.shake(trayEl, 4, 220);
      Juice.vibrate(12);
    }
    setTimeout(() => { propLock = false; }, 300);
  }

  function setBombMode(on){
    bombMode = !!on && props.bomb > 0 && !over;
    updateProps();
  }

  async function doBomb(x, y){
    if(over || busy || propLock || props.bomb <= 0) return;

    const o = boardOrigin(), pitch = cell + gap;
    const col = Math.floor((x - o.x + gap * 0.5) / pitch);
    const row = Math.floor((y - o.y + gap * 0.5) / pitch);

    if(row < 0 || row >= N || col < 0 || col >= N){
      snd('hit');
      if(window.Juice) Juice.shake(boardEl, 3, 150);
      return;
    }

    const cells = [];
    for(let r = row - 1; r <= row + 1; r++){
      for(let c = col - 1; c <= col + 1; c++){
        if(r < 0 || r >= N || c < 0 || c >= N) continue;
        if(board[r][c]) cells.push(r * N + c);
      }
    }
    if(!cells.length){
      snd('hit');
      if(window.Juice){
        Juice.float('这里是空的', x, y, {color:'#FFB4C2', size:16, dy:-40, life:650});
        Juice.shake(boardEl, 3, 150);
      }
      return;   // 空区域不消耗次数
    }

    propLock = true;
    busy = true;
    props.bomb--;
    setBombMode(false);

    const gain = 30 + cells.length * 18;
    score += gain;
    updateScore(true);

    cells.forEach(k => {
      const v = board[(k / N) | 0][k % N];
      const p = cellCenter(k);
      if(window.Juice){
        Juice.burst(p.x, p.y, {
          count: 10,
          colors: v ? [v.c1, v.c2, '#ffffff'] : ['#ffffff'],
          speed: 300, size: cell * 0.15, life: 700, gravity: 820, lift: 70, shape:'square'
        });
      }
    });
    if(window.Juice){
      Juice.burst(x, y, {
        count: 26, colors: ['#FFE38A','#FF8A9E','#FF6A4D','#ffffff'],
        speed: 460, size: cell * 0.2, life: 780, gravity: 620, lift: 110
      });
      Juice.float('+' + gain, x, y, {color:'#FFD08A', size:26, glow:'rgba(255,150,90,.7)', dy:-80});
      Juice.shake(boardEl, 11, 380);
      Juice.vibrate([20, 30, 26]);
    }
    snd('hit');
    snd('clear', 5);

    cells.forEach(k => cellEls[k].classList.add('clearing'));
    await sleep(300);
    cells.forEach(k => { board[(k / N) | 0][k % N] = null; });
    renderBoard();
    updateProps();
    lockProp(bombBtn);
    busy = false;
    propLock = false;
  }

  /* ========================================================
     十二、结束 / 重开
     ======================================================== */
  function endGame(){
    over = true;
    busy = false;
    setBombMode(false);

    const prev = window.Juice ? Juice.getStat(GAME).best : best;
    const isNew = score > prev;
    if(window.Juice){
      Juice.setBest(GAME, score);   // 唯一存档入口
      Juice.resetCombo();           // 连击归零
    }
    best = Math.max(score, prev);
    bestEl.textContent = best;
    updateScore();
    updateProps();

    finalScoreEl.textContent = score;
    bestScoreEl.textContent  = best;
    newRecBadge.style.display = isNew ? 'block' : 'none';
    snd('over');
    setTimeout(() => overlay.classList.add('show'), 340);
  }

  function restart(){
    overlay.classList.remove('show');
    for(let r = 0; r < N; r++) board[r].fill(null);
    score = 0; over = false; busy = false; propLock = false;
    dragging = null;
    dragLayer.textContent = '';
    props = {shuffle: 2, bomb: 2};
    bombMode = false;
    if(window.Juice) Juice.resetCombo();
    clearGhost();
    updateScore();
    renderBoard();
    refreshTray();
    updateProps();
    snd('click');
  }

  /* ========================================================
     十三、事件绑定
     ======================================================== */
  slotEls.forEach((el, i) => {
    el.addEventListener('pointerdown', e => startDrag(e, i));
  });

  boardEl.addEventListener('pointerdown', e => {
    if(!bombMode) return;
    e.preventDefault();
    doBomb(e.clientX, e.clientY);
  });

  restartBtn.addEventListener('click', () => {
    if(dragging){ dragging.el.remove(); dragging = null; }
    restart();
  });

  againBtn.addEventListener('click', restart);

  shuffleBtn.addEventListener('click', doShuffle);

  bombBtn.addEventListener('click', () => {
    if(over || props.bomb <= 0) return;
    snd('prop');
    setBombMode(!bombMode);
    if(window.Juice) Juice.vibrate(10);
  });

  // 防误触：长按菜单 / 双指缩放 / 页面滚动
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('touchmove', e => {
    if(e.touches.length > 1) e.preventDefault();
  }, {passive:false});

  // 退到后台 / 关闭页面时把最高分落盘
  document.addEventListener('visibilitychange', () => {
    if(document.hidden && window.Juice && score > 0){
      try{ Juice.setBest(GAME, score); }catch(e){}
    }
  });

  window.addEventListener('resize', () => {
    layout();
    if(!dragging) paintGhost();
  });
  window.addEventListener('orientationchange', () => setTimeout(layout, 220));

  /* ========================================================
     十四、启动
     ======================================================== */
  function init(){
    buildBoard();
    layout();
    updateScore();
    refreshTray();
    updateProps();

    // 接入合集内核：注入「返回大厅 / 静音」按钮、游玩次数累加、存档
    if(window.Juice){
      Juice.init({
        game: GAME,
        saveOnExit: function(){
          try{ if(score > 0) Juice.setBest(GAME, score); }catch(e){}
        }
      });
      readBest();
    }
    // 内核按钮注入后重算一次布局
    requestAnimationFrame(() => { layout(); });
  }

  init();
})();
</script>
</body>
</html>
