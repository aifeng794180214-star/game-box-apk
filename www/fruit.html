  endGame('bomb');
}

/* 线段检测：把本帧的划动线段与所有水果/炸弹求交 */
function sliceSegment(x1, y1, x2, y2) {
  if (state.phase !== 'playing') return;
  const dx = x2 - x1, dy = y2 - y1;
  if (dx * dx + dy * dy < 1) return;              // 位移太小不算一刀
  const cutAngle = Math.atan2(dy, dx);

  for (let i = fruits.length - 1; i >= 0; i--) {
    const f = fruits[i];
    if (f.dead || f.half) continue;
    if (!segHitsCircle(x1, y1, x2, y2, f.x, f.y, f.r * 0.94)) continue;
    if (f.special) { cutFruit(f, cutAngle); continue; }
    state.strokeCx += f.x; state.strokeCy += f.y;
    cutFruit(f, cutAngle);
  }

  for (let i = bombs.length - 1; i >= 0; i--) {
    const b = bombs[i];
    if (b.dead) continue;
    if (segHitsCircle(x1, y1, x2, y2, b.x, b.y, b.r * 0.92)) {
      explodeBomb(b);
      return;
    }
  }

  if (frenzyOrb && state.frenzy > 0 && segHitsCircle(x1, y1, x2, y2, frenzyOrb.x, frenzyOrb.y, frenzyOrb.r * 1.08)) {
    hitFrenzyOrb(cutAngle);
  }
}

/* ============================================================
   12. 一局的生命周期
   ============================================================ */
function startGame() {
  fruits.length = 0;
  bombs.length = 0;
  particles.length = 0;
  splats.length = 0;
  floats.length = 0;
  marks.length = 0;
  shocks.length = 0;
  trail.length = 0;
  frenzyOrb = null;

  state.phase = 'playing';
  state.score = 0;
  state.lastHud = -1;
  state.elapsed = 0;
  state.timeLeft = ZEN_TIME;
  state.hearts = state.maxHearts;
  state.spawnTimer = 0.35;
  state.nextPom = rnd(12, 18);
  state.strokeCount = 0;
  state.strokeCx = 0; state.strokeCy = 0;
  state.totalCut = 0;
  state.bestCombo = 0;
  state.shake = 0;
  state.flash = 0;
  state.frenzy = 0;

  ui.menu.classList.add('hidden');
  ui.over.classList.add('hidden');
  ui.hud.classList.remove('hide');
  ui.timer.classList.toggle('on', state.mode === 'zen');
  ui.timer.classList.remove('warn');

  buildHearts();
  syncHearts();
  syncHud();
  SFX.unlock();
}

function setOverTitle() {
  const d = I18N[lang];
  ui.overTitle.textContent = state.endReason === 'bomb' ? d.overBomb
                           : state.endReason === 'time' ? d.overTime
                           : d.over;
}

function endGame(reason) {
  if (state.phase === 'over') return;
  state.phase = 'over';
  state.strokeCount = 0;

  const isNew = state.score > (state.best[state.mode] || 0);
  if (isNew) { state.best[state.mode] = state.score; saveBest(); }

  ui.overScore.textContent = state.score;
  ui.overBest.textContent = state.best[state.mode];
  state.endReason = reason;
  setOverTitle();
  ui.overExtra.innerHTML = (isNew ? '<b style="color:#ffd94a">' + I18N[lang].newRecord + '</b><br>' : '') +
    I18N[lang].overStats.replace('{cut}', state.totalCut).replace('{combo}', state.bestCombo);
  ui.over.classList.remove('hidden');
  ui.hud.classList.add('hide');
  ui.timer.classList.remove('on');
  syncHud();
}

/* ============================================================
   13. 输入：鼠标按住滑动 / 手指划屏
   ============================================================ */
const ptr = { id: null, down: false, x: 0, y: 0 };

function evPos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

function onDown(e) {
  if (state.phase !== 'playing') return;
  SFX.unlock();
  ptr.id = e.pointerId;
  ptr.down = true;
  const p = evPos(e);
  ptr.x = p.x; ptr.y = p.y;
  state.strokeCount = 0;
  state.strokeCx = 0; state.strokeCy = 0;
  trail.length = 0;
  trail.push({ x: p.x, y: p.y, t: performance.now() / 1000 });
  SFX.swipe();
  if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (err) {} }
  e.preventDefault();
}

function onMove(e) {
  if (!ptr.down || (ptr.id !== null && e.pointerId !== ptr.id)) return;
  const p = evPos(e);
  // 关键：用「上一帧坐标 → 当前帧坐标」的线段做碰撞，快速甩刀也不漏
  sliceSegment(ptr.x, ptr.y, p.x, p.y);
  ptr.x = p.x; ptr.y = p.y;
  trail.push({ x: p.x, y: p.y, t: performance.now() / 1000 });
  if (trail.length > 320) trail.shift();
  e.preventDefault();
}

function onUp(e) {
  if (!ptr.down) return;
  ptr.down = false;
  ptr.id = null;
  finishStroke();
}

canvas.addEventListener('pointerdown', onDown);
canvas.addEventListener('pointermove', onMove);
canvas.addEventListener('pointerup', onUp);
canvas.addEventListener('pointercancel', onUp);
canvas.addEventListener('pointerleave', onUp);
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
// 老版 iOS：阻止页面滚动与缩放
document.addEventListener('touchmove', (e) => { if (e.cancelable) e.preventDefault(); }, { passive: false });
document.addEventListener('gesturestart', (e) => e.preventDefault());

/* ============================================================
   14. 每帧更新
   ============================================================ */
function update(dt) {
  // 震屏与白闪衰减
  state.shake *= Math.pow(0.0015, dt);
  if (state.shake < 0.05) state.shake = 0;
  state.flash *= Math.pow(0.004, dt);
  if (state.flash < 0.01) state.flash = 0;

  updateFx(dt);

  if (state.phase === 'playing') {
    state.elapsed += dt;

    // 禅宗倒计时
    if (state.mode === 'zen') {
      state.timeLeft -= dt;
      if (state.timeLeft <= 0) { state.timeLeft = 0; endGame('time'); }
      ui.timer.textContent = Math.ceil(state.timeLeft) + 's';
      ui.timer.classList.toggle('warn', state.timeLeft <= 10);
    }

    // 抛射节奏
    state.spawnTimer -= dt;
    if (state.spawnTimer <= 0) {
      spawnWave();
      state.spawnTimer = spawnInterval();
    }
  }

  // 水果物理（抛物线）
  for (let i = fruits.length - 1; i >= 0; i--) {
    const f = fruits[i];
    if (f.dead) { fruits.splice(i, 1); continue; }
    f.vy += GRAVITY * SCALE * dt;
    f.x += f.vx * dt;
    f.y += f.vy * dt;
    f.rot += f.vr * dt;

    // 完整水果落到屏幕下方 = 漏切
    if (!f.half && state.phase === 'playing' && f.y - f.r > H + 8 && f.vy > 0) {
      if (state.mode === 'classic') {
        state.hearts = Math.max(0, state.hearts - 1);
        syncHearts();
        addMark(f.x, H - 26 * SCALE);
        SFX.miss();
        state.shake = Math.max(state.shake, 4);
        if (state.hearts <= 0) endGame('miss');
      }
      fruits.splice(i, 1);
      continue;
    }
    // 飞出屏幕外的半果直接回收
    if (f.y - f.r > H + 240 || f.x < -320 || f.x > W + 320) fruits.splice(i, 1);
  }

  // 炸弹物理
  for (let i = bombs.length - 1; i >= 0; i--) {
    const b = bombs[i];
    if (b.dead) { bombs.splice(i, 1); continue; }
    b.vy += GRAVITY * SCALE * dt;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.rot += b.vr * dt;
    if (b.y - b.r > H + 120) bombs.splice(i, 1);
  }

  // 狂热石榴球：2 秒内停留场中，可被反复划切
  if (frenzyOrb) {
    const o = frenzyOrb;
    state.frenzy -= dt;
    o.vy += GRAVITY * SCALE * 0.34 * dt;
    o.x += o.vx * dt;
    o.y += o.vy * dt;
    o.rot += o.vr * dt;
    o.pulse *= Math.pow(0.02, dt);
    // 边界反弹，保证球一直留在可切区域
    const pad = o.r + 12 * SCALE;
    if (o.x < pad) { o.x = pad; o.vx = Math.abs(o.vx) * 0.7 + 40; }
    if (o.x > W - pad) { o.x = W - pad; o.vx = -Math.abs(o.vx) * 0.7 - 40; }
    if (o.y < pad + H * 0.18) { o.y = pad + H * 0.18; o.vy = Math.abs(o.vy) * 0.5; }
    if (o.y > H - pad) { o.y = H - pad; o.vy = -Math.abs(o.vy) * 0.62 - 120 * SCALE; }

    if (state.frenzy <= 0) {
      spawnJuice(o.x, o.y, '#ffe066', 40);
      addSplat(o.x, o.y, 'rgba(255,214,74,0.85)', o.r * 1.2);
      addShock(o.x, o.y, '#ffd94a', 220);
      addFloat(o.x, o.y - o.r, I18N[lang].frenzyEnd + ' +' + state.frenzyTotal, '#ffd94a', 22 * SCALE);
      frenzyOrb = null;
    }
  }

  syncHud();
}

/* ============================================================
   15. 渲染
   ============================================================ */
function renderFrenzyAura(g) {
  if (!frenzyOrb || state.frenzy <= 0) return;
  const t = clamp(state.frenzy / 2, 0, 1);
  g.save();
  g.globalCompositeOperation = 'lighter';
  const grd = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.25, W / 2, H / 2, Math.max(W, H) * 0.72);
  grd.addColorStop(0, 'rgba(255,196,60,0)');
  grd.addColorStop(0.7, 'rgba(255,178,40,' + (0.10 + 0.10 * t).toFixed(3) + ')');
  grd.addColorStop(1, 'rgba(255,120,0,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, W, H);
  g.restore();
}

function render() {
  ctx.save();

  // 震屏
  if (state.shake > 0.05) {
    const a = state.shake * SCALE;
    ctx.translate(rnd(-a, a), rnd(-a, a));
  }

  ctx.drawImage(bgCanvas, 0, 0, W, H);
  drawSplats(ctx);
  renderFrenzyAura(ctx);

  // 半果先画（压在完整水果下面，层次更像真实堆叠）
  for (const f of fruits) if (f.half && !f.dead) drawFruitEntity(ctx, f, gameTime);
  for (const b of bombs) if (!b.dead) drawBomb(ctx, b, gameTime);
  for (const f of fruits) if (!f.half && !f.dead) drawFruitEntity(ctx, f, gameTime);

  // 狂热石榴球
  if (frenzyOrb) {
    const o = frenzyOrb;
    ctx.save();
    ctx.translate(o.x, o.y);
    const pulse = 1 + o.pulse * 0.16;
    ctx.scale(pulse, pulse);
    ctx.rotate(o.rot);
    // 金色光晕
    ctx.globalCompositeOperation = 'lighter';
    const grd = ctx.createRadialGradient(0, 0, o.r * 0.2, 0, 0, o.r * 2);
    grd.addColorStop(0, 'rgba(255,235,140,0.40)');
    grd.addColorStop(1, 'rgba(255,180,40,0)');
    ctx.beginPath(); ctx.arc(0, 0, o.r * 2, 0, TAU);
    ctx.fillStyle = grd; ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    drawWholeFruit(ctx, 'pomegranate', o.r, gameTime);
    ctx.restore();
  }

  drawParticles(ctx);
  drawShocks(ctx);
  drawMarks(ctx);
  drawBlade(ctx);
  drawFloats(ctx);

  ctx.restore();

  // 炸弹白光
  if (state.flash > 0.01) {
    ctx.save();
    ctx.fillStyle = 'rgba(255,252,240,' + Math.min(1, state.flash).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  // 狂热连切倒计时提示
  if (state.frenzy > 0 && frenzyOrb) {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const s = 22 * SCALE;
    ctx.font = '900 ' + (s | 0) + 'px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';
    ctx.globalAlpha = 0.55 + 0.45 * Math.abs(Math.sin(gameTime * 8));
    ctx.fillStyle = '#ffd94a';
    ctx.shadowColor = '#ff9d00';
    ctx.shadowBlur = 26;
    ctx.fillText(I18N[lang].frenzy + ' ' + state.frenzy.toFixed(1) + 's', W / 2, H * 0.105);
    ctx.restore();
  }
}

/* ============================================================
   16. 多语言（中文 / English 一键切换）
   ============================================================ */
const I18N = {
  zh: {
    score: '得分', best: '最高', title: '水果忍者',
    subtitle: '挥刀斩果 · 一刀多杀 · 汁水四溅',
    modeTitle: '选择模式', classic: '经典模式', classicDesc: '3 颗红心 · 切到炸弹即结束',
    zen: '禅宗模式', zenDesc: '90 秒倒计时 · 无炸弹尽情切',
    bladeTitle: '刀刃皮肤', blade0: '经典白刃', blade1: '烈焰红莲', blade2: '冰霜极光',
    start: '开 始 游 戏',
    hint: '按住鼠标左键滑动 / 手指划屏切水果<br>一刀划过 3 个以上水果触发疯狂连击',
    over: '游戏结束', overBomb: '炸弹引爆！', overTime: '时间到！',
    finalScore: '本局得分', again: '再 来 一 局', home: '返回首页',
    newRecord: '🎉 新纪录！', overStats: '切果 {cut} 个 · 最高 {combo} 连切',
    comboUnit: '连切', comboWord: 'COMBO!', frenzy: '狂热连切', frenzyEnd: '狂热结束'
  },
  en: {
    score: 'SCORE', best: 'BEST', title: 'Fruit Ninja',
    subtitle: 'Slice fast · Chain combos · Juice everywhere',
    modeTitle: 'GAME MODE', classic: 'Classic', classicDesc: '3 lives · One bomb ends it all',
    zen: 'Zen Mode', zenDesc: '90 seconds · No bombs, pure slicing',
    bladeTitle: 'BLADE SKIN', blade0: 'Classic', blade1: 'Crimson Flame', blade2: 'Frost Aurora',
    start: 'S T A R T',
    hint: 'Hold the left mouse button and swipe / drag with your finger<br>Slice 3+ fruits in one swipe for a mad combo',
    over: 'Game Over', overBomb: 'Boom!', overTime: "Time's Up!",
    finalScore: 'Score', again: 'P L A Y   A G A I N', home: 'Back to Home',
    newRecord: '🎉 New record!', overStats: '{cut} fruits sliced · best {combo} combo',
    comboUnit: ' combo', comboWord: 'COMBO!', frenzy: 'FRENZY', frenzyEnd: 'Frenzy ends'
  }
};
let lang = 'zh';

function applyLang() {
  const dict = I18N[lang];
  document.querySelectorAll('[data-i18n]').forEach((node) => {
    const key = node.getAttribute('data-i18n');
    const v = dict[key];
    if (v != null) node.innerHTML = v;
  });
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  ui.lang.textContent = lang === 'zh' ? 'EN' : '中';
  // 结束面板标题按结束原因重新翻译
  if (state.phase === 'over') setOverTitle();
  try { localStorage.setItem(LS_LANG, lang); } catch (e) {}
  state.lastHud = -1;
  syncHud();
}

/* ============================================================
   17. UI 交互绑定
   ============================================================ */
document.querySelectorAll('.mode-card').forEach((card) => {
  card.addEventListener('click', () => {
    document.querySelectorAll('.mode-card').forEach((c) => c.classList.remove('active'));
    card.classList.add('active');
    state.mode = card.getAttribute('data-mode');
  });
});

document.querySelectorAll('.blade-card').forEach((card) => {
  card.addEventListener('click', () => {
    document.querySelectorAll('.blade-card').forEach((c) => c.classList.remove('active'));
    card.classList.add('active');
    bladeIndex = parseInt(card.getAttribute('data-blade'), 10) || 0;
    try { localStorage.setItem(LS_BLADE, bladeIndex); } catch (e) {}
  });
});

ui.start.addEventListener('click', () => startGame());
ui.again.addEventListener('click', () => startGame());
ui.home.addEventListener('click', () => {
  state.phase = 'menu';
  ui.over.classList.add('hidden');
  ui.menu.classList.remove('hidden');
  ui.hud.classList.add('hide');
  ui.timer.classList.remove('on');
  buildHearts(); syncHearts(); syncHud();
});

ui.mute.addEventListener('click', () => {
  const muted = !SFX.muted;
  SFX.setMuted(muted);
  ui.mute.textContent = muted ? '🔇' : '🔊';
  ui.mute.classList.toggle('muted', muted);
});

ui.lang.addEventListener('click', () => {
  lang = lang === 'zh' ? 'en' : 'zh';
  applyLang();
});

// 空格键快捷开始 / 重开
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    if (state.phase !== 'playing') { e.preventDefault(); startGame(); }
  }
});

// Esc 返回首页
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && state.phase === 'playing') {
    state.phase = 'menu';
    ui.menu.classList.remove('hidden');
    ui.hud.classList.add('hide');
    ui.timer.classList.remove('on');
  }
});

/* ============================================================
   18. 主循环（60fps，dt 上限防止切后台后瞬移）
   ============================================================ */
let lastT = performance.now();
function frame(now) {
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (!isFinite(dt) || dt < 0) dt = 1 / 60;
  dt = Math.min(dt, 0.05);
  gameTime += dt;
  update(dt);
  render();
  requestAnimationFrame(frame);
}

/* ============================================================
   19. 启动
   ============================================================ */
loadBest();
try {
  const savedLang = localStorage.getItem(LS_LANG);
  if (savedLang === 'en' || savedLang === 'zh') lang = savedLang;
  const savedBlade = parseInt(localStorage.getItem(LS_BLADE), 10);
  if (savedBlade >= 0 && savedBlade < BLADES.length) {
    bladeIndex = savedBlade;
    document.querySelectorAll('.blade-card').forEach((c) => {
      c.classList.toggle('active', parseInt(c.getAttribute('data-blade'), 10) === savedBlade);
    });
  }
} catch (e) {}

resize();
buildHearts();
syncHearts();
applyLang();
syncHud();
requestAnimationFrame(frame);

// 自动化测试钩子（不影响正常游戏）
window.__QA = {
  state, fruits, bombs,
  start(mode) {
    if (mode) {
      state.mode = mode;
      document.querySelectorAll('.mode-card').forEach((c) =>
        c.classList.toggle('active', c.getAttribute('data-mode') === mode));
    }
    startGame();
  },
  spawn: spawnWave,
  slice: (x1, y1, x2, y2) => sliceSegment(x1, y1, x2, y2),
  sliceAll() {
    for (let i = fruits.length - 1; i >= 0; i--) {
      const f = fruits[i];
      if (f.dead || f.half) continue;
      state.strokeCx += f.x; state.strokeCy += f.y;
      cutFruit(f, 0);
    }
  },
  endGame, splitFruit, FRUIT_DATA, FRUIT_TYPES,
  // 测试用：直接投放实体到画面中部，方便自动化验证切割逻辑
  put(type) {
    const f = newFruit(type);
    f.y = H * 0.45; f.vy = 0; f.vx = 0;
    fruits.push(f);
    return f;
  },
  putBomb() {
    const b = newBomb();
    b.y = H * 0.45; b.vy = 0; b.vx = 0;
    bombs.push(b);
    return b;
  },
  cut(i, ang) { cutFruit(fruits[i], ang || 0); },
  frenzy: startFrenzy,
  W: () => W, H: () => H
};
/* ============ JuiceKit 统一内核接入：返回大厅 / 静音 / 震动 / 最高分 ============ */
(function () {
  var J = window.Juice; if (!J) return;
  var st = document.createElement('style');
  st.textContent = '#hud{padding-top:calc(56px + env(safe-area-inset-top))!important}#btnMute{display:none!important}';
  document.head.appendChild(st);
  try { SFX.setMuted(!!J.muted); } catch (e) {}
  var ot = J.toggleMute.bind(J);
  J.toggleMute = function () { var m = ot(); try { SFX.setMuted(!!m); } catch (e) {} return m; };
  function buzz(ms) { try { if (!J.muted && navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }
  function wrap(n, ms) { var f = SFX[n]; if (typeof f !== 'function') return; SFX[n] = function () { buzz(ms); return f.apply(SFX, arguments); }; }
  wrap('slice', 8); wrap('combo', 18); wrap('miss', 24); wrap('frenzy', 30);
  function topBest() { try { var b = state.best || {}, m = 0; for (var k in b) if (b[k] > m) m = b[k]; return m; } catch (e) { return 0; } }
  J.init({ game: 'fruit', saveOnExit: function () { try { saveBest(); } catch (e) {} } });
  var lastBest = -1;
  function syncBest() {
    var b = topBest();
    if (b > 0 && b !== lastBest) { lastBest = b; try { J.setBest('fruit', b); } catch (e) {} }
  }
  syncBest(); setInterval(syncBest, 1500);


})();
})();
</script>
